[package]
name = "bio-binaries"
version = "0.2.1"
edition = "2021"
description = "24 bio-inspired system utilities with Echo-X UDP orchestration"

[dependencies]
sysinfo = "0.30"
blake3 = "1.5"
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
colored = "2"
tokio = { version = "1", features = ["full"] }
notify = "6"
rustfft = "6"
walkdir = "2"
chrono = "0.4"
regex = "1"
qrcode = "0.14"
image = "0.25"
flate2 = "1.0"
memmap2 = "0.9"
reqwest = { version = "0.13.2", features = ["json"] }

[lib]
name = "bio_binaries"
path = "src/lib.rs"

# ── RÉTEG 1: Bio-Evolúció ──
[[bin]]
name = "viral-infect"
path = "src/bin/viral_infect.rs"

[[bin]]
name = "hox-diff"
path = "src/bin/hox_diff.rs"

[[bin]]
name = "plasmid-dream"
path = "src/bin/plasmid_dream.rs"

[[bin]]
name = "plasmid-inject"
path = "src/bin/plasmid_inject.rs"

